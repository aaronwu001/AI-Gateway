version: '3.8'

services:
  # 1. Redis
  redis:
    image: redis:7-alpine
    container_name: ai-gateway-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - gateway-net

  # 2. Mock Backend (新增這個!)
  mock-backend:
    build: ./mock-backend       # 指向我們剛剛建的資料夾
    container_name: ai-mock-backend
    ports:
      - "5001:5001"             # 讓本機可以透過 localhost:5001 測試它
    environment:
      - SERVICE_NAME=Python-AI-Model
    networks:
      - gateway-net

  # (Gateway 暫時還不需要 Docker 化，我們先在本機跑 Go)

volumes:
  redis_data:

networks:
  gateway-net: