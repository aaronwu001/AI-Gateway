server:
  port: 8080
  mode: "development"

redis:
  addr: "localhost:6379"
  password: ""
  failure_mode: "open" # Allow requests when a failure occurs

services:
  - name: "gpt4-service"
    path: "/api/v1/gpt4"
    target_url: "http://localhost:5001"
    rate_limit:
      global_rate: 1000.0
      global_capacity: 1000.0
      ip_rate: 100.0
      ip_capacity: 100.0
      user_rate: 0.0      # Test setting: 0 disables token refill
      user_capacity: 3.0  # Test setting: capacity is 3

  - name: "vision-service"
    path: "/api/v1/vision"
    target_url: "http://localhost:5001" # Currently points to the same mock backend
    rate_limit:
      global_rate: 1000.0
      global_capacity: 1000.0
      ip_rate: 10.0
      ip_capacity: 10.0
      user_rate: 1.0
      user_capacity: 10.0